<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1024" />
  <title>四位數推理局｜猜數字</title>
  <style>
    :root {
      --bg: #080c1c;
      --panel: rgba(19, 27, 58, .82);
      --panel-2: rgba(12, 18, 43, .78);
      --line: rgba(157, 170, 255, .18);
      --text: #f6f7ff;
      --muted: #aab4d8;
      --primary: #7888ff;
      --primary-2: #9d7bff;
      --success: #73e6b7;
      --danger: #ff718e;
      --shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(120, 136, 255, .22), transparent 28%),
        radial-gradient(circle at 90% 12%, rgba(157, 123, 255, .18), transparent 25%),
        linear-gradient(145deg, #080c1c 0%, #101633 54%, #1b1237 100%);
      padding: 28px 16px 48px;
    }
    button, input { font: inherit; }
    button { border: 0; }
    .shell { width: min(760px, 100%); margin: auto; }
    .brand { text-align: center; margin: 12px 0 26px; }
    .brand-mark {
      display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 18px;
      margin-bottom: 12px; font-size: 27px; background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 12px 30px rgba(120, 136, 255, .28);
    }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.04em; }
    h2 { margin: 0 0 18px; font-size: 21px; }
    .subtitle { margin: 10px auto 0; color: var(--muted); line-height: 1.7; }
    .card {
      padding: clamp(20px, 5vw, 32px); margin: 16px 0; border: 1px solid var(--line); border-radius: 26px;
      background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(18px);
    }
    .hero-card { text-align: center; }
    .hero-card h2 { margin-bottom: 8px; }
    .rule { color: var(--muted); margin: 0 0 24px; }
    .row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    button, input { border-radius: 14px; padding: 13px 17px; }
    button { color: white; font-weight: 800; cursor: pointer; transition: transform .18s ease, filter .18s ease, box-shadow .18s ease; }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .primary { background: linear-gradient(135deg, var(--primary), #6374f5); box-shadow: 0 8px 20px rgba(120, 136, 255, .22); }
    .secondary { background: rgba(75, 88, 139, .7); }
    .danger { background: rgba(190, 58, 91, .9); }
    input { width: 190px; color: var(--text); background: var(--panel-2); border: 1px solid rgba(157, 170, 255, .28); outline: none; text-align: center; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(120, 136, 255, .14); }
    #playerName { width: 220px; }
    .latest-row td { background: rgba(120, 136, 255, .13); border-bottom-color: rgba(157, 170, 255, .32); }
    .latest-badge { display: inline-block; margin-right: 6px; padding: 3px 7px; color: #fff; border-radius: 999px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); font-size: 11px; font-weight: 900; letter-spacing: .04em; vertical-align: middle; }
    #room { text-transform: uppercase; }
    #guess { letter-spacing: 8px; font-size: 20px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .room-title { color: #dfe3ff; font-size: 14px; font-weight: 800; }
    .status { margin: 22px 0; padding: 15px 18px; color: #e6eaff; text-align: center; line-height: 1.6; border: 1px solid var(--line); border-radius: 15px; background: rgba(8, 13, 32, .58); }
    .error { min-height: 24px; margin: 12px 0 0; color: #ff9db0; text-align: center; font-size: 14px; }
    .win { margin-top: 22px; color: var(--success); text-align: center; font-size: 22px; font-weight: 900; }
    .players { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
    .player { padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(8, 13, 32, .55); line-height: 1.8; }
    .player.active { border-color: var(--primary); box-shadow: inset 0 0 0 1px rgba(120, 136, 255, .3); }
    .small { color: var(--muted); font-size: 13px; }
    table { width: 100%; margin-top: 22px; border-collapse: collapse; overflow: hidden; font-size: 14px; }
    th, td { padding: 12px 8px; border-bottom: 1px solid var(--line); text-align: center; }
    th { color: var(--muted); font-weight: 700; }
    .ab { color: var(--success); font-weight: 900; }
    .hint { margin: 18px 0 0; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.7; }
    .hidden { display: none !important; }
    @media (max-width: 560px) { .players { grid-template-columns: 1fr; } .toolbar { align-items: stretch; } .toolbar > * { flex: 1; } .room-title { flex-basis: 100%; text-align: center; order: -1; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand-mark">🎯</div>
      <h1>四位數推理局</h1>
      <p class="subtitle">用邏輯破解答案，猜到 <strong>4A0B</strong> 就能獲勝。</p>
    </header>

    <section id="home" class="card hero-card">
      <h2>選擇遊戲模式</h2>
      <p class="rule">答案由四個不重複的數字組成，第一位不能是 0。</p>
      <div class="row">
        <button class="primary" onclick="single()">👤 開始單人遊戲</button>
        <button class="secondary" onclick="showMulti()">👥 建立雙人房間</button>
      </div>
    </section>

    <section id="multi" class="card hidden">
      <h2>👥 雙人房間</h2>
      <p class="rule">先輸入你的玩家名稱，再輸入自訂代碼；代碼留白會自動建立房間。</p>
      <div class="row">
        <input id="playerName" maxlength="20" placeholder="玩家名稱" aria-label="玩家名稱" autocomplete="nickname" />
        <input id="room" maxlength="8" placeholder="房間代碼" autocomplete="off" />
        <button class="primary" onclick="createRoom()">建立房間</button>
        <button class="secondary" onclick="joinRoom()">加入房間</button>
      </div>
      <div id="multiMsg" class="status">建立房間後，把代碼分享給朋友即可一起遊玩。</div>
      <div id="err" class="error"></div>
      <button class="secondary" onclick="home()">← 返回首頁</button>
    </section>

    <section id="game" class="card hidden">
      <div class="toolbar">
        <button class="secondary" onclick="home()">← 返回</button>
        <span id="roomTitle" class="room-title"></span>
        <button class="danger" onclick="restart()">再來一局</button>
      </div>
      <div id="status" class="status"></div>

      <div id="rps" class="hidden">
        <h2 style="text-align:center">✊ 猜拳決定先手</h2>
        <div class="row">
          <button class="choice secondary" onclick="rps('rock')">✊ 石頭</button>
          <button class="choice secondary" onclick="rps('paper')">✋ 布</button>
          <button class="choice secondary" onclick="rps('scissors')">✌️ 剪刀</button>
        </div>
      </div>

      <div id="guessBox" class="hidden">
        <h2 style="text-align:center">輸入你的四位數</h2>
        <div class="row">
          <input id="guess" maxlength="4" inputmode="numeric" placeholder="1234" autocomplete="off" />
          <button class="primary" onclick="guess()">猜！</button>
        </div>
        <div id="guessErr" class="error"></div>
      </div>

      <div id="players" class="players hidden"></div>
      <table id="history" class="hidden">
        <thead><tr><th>玩家</th><th>猜測</th><th>結果</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div id="win" class="win hidden"></div>
      <p class="hint">A 代表數字與位置都正確；B 代表數字正確但位置不同。</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update, runTransaction, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC1akT6-tAIOUnN9F6FcvBHVjcX-gYafgk",
      authDomain: "project-1488991214081379497.firebaseapp.com",
      databaseURL: "https://project-1488991214081379497-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "project-1488991214081379497",
      storageBucket: "project-1488991214081379497.firebasestorage.app",
      messagingSenderId: "638810612915",
      appId: "1:638810612915:web:c8e3bf378d6aa6b2cebcc6",
      measurementId: "G-5DJ4ZBFJZM"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let mode = "", roomCode = "", secret = "", singleHistory = [], stopListen = null, presenceRef = null;
    const myId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random()}`).replaceAll('.', '');
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
    const valid = (value) => /^\d{4}$/.test(value) && new Set(value).size === 4 && value[0] !== "0";
    const makeSecret = () => ["1","2","3","4","5","6","7","8","9"].sort(() => Math.random() - .5).slice(0, 4).join("");
    const score = (answer, guessValue) => { let A = 0, B = 0; for (let i = 0; i < 4; i++) answer[i] === guessValue[i] ? A++ : answer.includes(guessValue[i]) && B++; return { A, B }; };
    const showErr = (message) => { $("err").textContent = message; };
    const getPlayerName = () => {
      const name = $("playerName").value.trim();
      if (!name) { showErr("請先輸入玩家名稱。"); $("playerName").focus(); return null; }
      if (name.length > 20) { showErr("玩家名稱最多 20 個字元。"); $("playerName").focus(); return null; }
      return name;
    };
    const showFirebaseError = (error) => { showErr(error?.code === "PERMISSION_DENIED" ? "Firebase 權限不足，請檢查 Realtime Database Rules。" : "連線發生問題，請確認 Firebase 設定與網路。 "); console.error(error); };
    const playerRefFor = (code) => ref(db, `rooms/${code}/players/${myId}`);
    const armDisconnect = async (code) => { presenceRef = playerRefFor(code); await onDisconnect(presenceRef).remove(); };
    const removeFromRoom = async (code, playerRef = playerRefFor(code)) => {
      try { await set(playerRef, null); await onDisconnect(playerRef).cancel(); }
      catch (error) { showFirebaseError(error); }
    };

    function home() {
      const leavingRoom = roomCode;
      const leavingPresenceRef = presenceRef;
      if (stopListen) stopListen();
      stopListen = null;
      presenceRef = null;
      if (leavingRoom) removeFromRoom(leavingRoom, leavingPresenceRef || playerRefFor(leavingRoom));
      roomCode = ""; mode = "";
      $("game").classList.add("hidden"); $("multi").classList.add("hidden"); $("home").classList.remove("hidden");
    }
    function showMulti() { $("home").classList.add("hidden"); $("multi").classList.remove("hidden"); $("err").textContent = ""; $("room").focus(); }
    function single() { mode = "single"; secret = makeSecret(); singleHistory = []; $("home").classList.add("hidden"); $("multi").classList.add("hidden"); $("game").classList.remove("hidden"); $("roomTitle").textContent = "👤 單人模式"; $("status").textContent = "電腦已經出好題，開始推理吧！"; $("rps").classList.add("hidden"); $("guessBox").classList.remove("hidden"); $("guess").disabled = false; $("guess").value = ""; $("historyBody").innerHTML = ""; $("history").classList.add("hidden"); $("win").classList.add("hidden"); }
    function randomRoom() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }

    async function createRoom() { try { const name = getPlayerName(); if (!name) return; const code = ($("room").value.trim() || randomRoom()).toUpperCase(); if (!/^[A-Z0-9]{3,8}$/.test(code)) return showErr("房間代碼只能包含 3～8 個英數字。"); const roomRef = ref(db, `rooms/${code}`); if ((await get(roomRef)).exists()) return showErr("房間已存在，請換一個代碼。"); await set(roomRef, { phase: "waiting", secret: makeSecret(), turnId: null, winnerId: null, winnerName: null, notice: null, players: { [myId]: { id: myId, name, rps: null } }, history: {} }); enter(code); $("multiMsg").textContent = `房間 ${code} 已建立，請把代碼分享給朋友。`; } catch (error) { showFirebaseError(error); } }
    async function joinRoom() { try { const name = getPlayerName(); if (!name) return; const code = $("room").value.trim().toUpperCase(); if (!code) return showErr("請先輸入房間代碼。"); const roomRef = ref(db, `rooms/${code}`), snapshot = await get(roomRef); if (!snapshot.exists()) return showErr("找不到這個房間。"); const players = snapshot.val().players || {}; if (Object.keys(players).length >= 2) return showErr("房間已滿。"); await update(roomRef, { [`players/${myId}`]: { id: myId, name, rps: null }, phase: "rps", secret: makeSecret(), turnId: null, winnerId: null, winnerName: null, notice: null, history: {} }); enter(code); } catch (error) { showFirebaseError(error); } }
    function enter(code) { roomCode = code; mode = "multi"; $("multi").classList.add("hidden"); $("game").classList.remove("hidden"); $("roomTitle").textContent = `👥 房間：${code}`; $("win").classList.add("hidden"); if (stopListen) stopListen(); armDisconnect(code).catch(showFirebaseError); stopListen = onValue(ref(db, `rooms/${code}`), (snapshot) => snapshot.exists() ? render(snapshot.val()) : showRoomClosed(), showFirebaseError); }
    async function rps(choice) { if (roomCode) try { await set(ref(db, `rooms/${roomCode}/players/${myId}/rps`), choice); } catch (error) { showFirebaseError(error); } }

    async function guess() { const guessValue = $("guess").value.trim(); $("guessErr").textContent = ""; if (!valid(guessValue)) return $("guessErr").textContent = "請輸入 4 位不重複數字，第一位不能是 0。"; if (mode === "single") { const result = score(secret, guessValue); singleHistory.unshift({ name: "你", guess: guessValue, A: result.A, B: result.B, createdAt: Date.now() }); drawHistory(singleHistory); $("guess").value = ""; if (result.A === 4) { $("status").textContent = "恭喜你破解答案！"; $("win").textContent = `🏆 答案是 ${secret}`; $("win").classList.remove("hidden"); $("guessBox").classList.add("hidden"); } else $("status").textContent = `這次是 ${result.A}A${result.B}B，繼續推理！`; return; } try { const result = await runTransaction(ref(db, `rooms/${roomCode}`), (data) => { if (!data || data.phase !== "playing" || data.turnId !== myId) return data; const outcome = score(data.secret, guessValue), history = data.history || {}, createdAt = Date.now(); history[`${createdAt}_${myId}`] = { name: data.players[myId].name, guess: guessValue, A: outcome.A, B: outcome.B, createdAt }; if (outcome.A === 4) { data.phase = "finished"; data.winnerId = myId; data.winnerName = data.players[myId].name; } else { const other = Object.keys(data.players || {}).find((id) => id !== myId); if (other) data.turnId = other; } data.history = history; return data; }); $("guess").value = ""; if (!result.committed) $("guessErr").textContent = "現在不是你的回合。"; } catch (error) { showFirebaseError(error); } }
    async function restart() { if (mode === "single") return single(); if (roomCode) try { await update(ref(db, `rooms/${roomCode}`), { phase: "rps", secret: makeSecret(), turnId: null, winnerId: null, winnerName: null, notice: null, history: {}, [`players/${myId}/rps`]: null }); } catch (error) { showFirebaseError(error); } }
    function showRoomClosed() { $("status").textContent = "房間已關閉或不存在，請返回首頁重新加入。"; $("rps").classList.add("hidden"); $("guessBox").classList.add("hidden"); $("win").classList.add("hidden"); }
    async function recoverRoomAfterPlayerLeft(data, players) {
      if (players.length !== 1 || data.phase === "waiting") return;
      try {
        await runTransaction(ref(db, `rooms/${roomCode}`), (current) => {
          const currentPlayers = Object.values(current?.players || {});
          if (!current || current.phase === "waiting" || currentPlayers.length !== 1) return current;
          const remainingId = currentPlayers[0].id;
          return {
            ...current,
            phase: "waiting",
            secret: makeSecret(),
            turnId: null,
            winnerId: null,
            winnerName: null,
            notice: "對方已離開房間，回合已自動重設。請等待新玩家加入。",
            history: {},
            players: { [remainingId]: { ...current.players[remainingId], rps: null } }
          };
        });
      } catch (error) { showFirebaseError(error); }
    }
    function drawHistory(history) { const ordered = [...history].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); $("history").classList.toggle("hidden", !ordered.length); $("historyBody").innerHTML = ordered.map((item, index) => `<tr class="${index === 0 ? "latest-row" : ""}"><td>${index === 0 ? '<span class="latest-badge">最新</span>' : ""}${esc(item.name)}</td><td>${esc(item.guess)}</td><td class="ab">${item.A}A${item.B}B</td></tr>`).join(""); }

    async function resolveRps(data, players) { if (data.phase !== "rps" || players.length !== 2 || !players.every((player) => player.rps)) return; const [a, b] = players; if (a.rps === b.rps) { await update(ref(db, `rooms/${roomCode}`), { [`players/${a.id}/rps`]: null, [`players/${b.id}/rps`]: null }); return; } const first = (a.rps === "rock" && b.rps === "scissors") || (a.rps === "scissors" && b.rps === "paper") || (a.rps === "paper" && b.rps === "rock") ? a.id : b.id; await runTransaction(ref(db, `rooms/${roomCode}`), (current) => current?.phase === "rps" ? { ...current, phase: "playing", turnId: first } : current); }
    function render(data) {
      const players = Object.values(data.players || {});
      const hasMe = Boolean(data.players?.[myId]);
      const rpsText = (choice) => choice === "rock" ? "✊ 石頭" : choice === "paper" ? "✋ 布" : "✌️ 剪刀";
      $("players").classList.remove("hidden");
      $("players").innerHTML = players.map((player) => {
        const canReveal = player.id === myId || data.phase !== "rps";
        const choiceText = player.rps ? (canReveal ? rpsText(player.rps) : "已出拳") : "尚未出拳";
        return `<div class="player ${data.turnId === player.id && !data.winnerId ? "active" : ""}"><b>${esc(player.name)} ${player.id === myId ? "（你）" : ""}</b><br><span class="small">猜拳：${choiceText}</span></div>`;
      }).join("");
      if (!hasMe) {
        $("status").textContent = "你已離開房間，請返回首頁後重新加入。";
        $("rps").classList.add("hidden"); $("guessBox").classList.add("hidden"); $("win").classList.add("hidden");
      } else if (players.length < 2) {
        $("status").textContent = data.notice || (data.phase !== "waiting" ? "對方已離開房間，正在自動重設回合……" : "等待另一位玩家加入……");
        $("rps").classList.add("hidden"); $("guessBox").classList.add("hidden"); $("win").classList.add("hidden");
        recoverRoomAfterPlayerLeft(data, players).catch(showFirebaseError);
      } else if (data.phase === "rps") {
        $("status").textContent = players.every((player) => player.rps) ? "正在決定先手……" : "雙方已就位，請選擇你的拳。";
        $("rps").classList.remove("hidden"); $("guessBox").classList.add("hidden"); $("win").classList.add("hidden");
      } else if (data.phase === "playing") {
        $("rps").classList.add("hidden"); $("guessBox").classList.remove("hidden"); $("guess").disabled = data.turnId !== myId; $("win").classList.add("hidden");
        $("status").textContent = data.turnId === myId ? "輪到你猜！" : "輪到對方猜，請稍候。";
      } else if (data.phase === "finished") {
        $("rps").classList.add("hidden"); $("guessBox").classList.add("hidden");
        $("status").textContent = "本局遊戲結束"; $("win").textContent = `🏆 ${esc(data.winnerName)} 獲勝！答案：${esc(data.secret)}`; $("win").classList.remove("hidden");
      }
      drawHistory(Object.values(data.history || {}));
      if (hasMe) resolveRps(data, players).catch(showFirebaseError);
    }

    $("guess").addEventListener("keydown", (event) => event.key === "Enter" && guess());
    $("room").addEventListener("keydown", (event) => event.key === "Enter" && joinRoom());
    $("playerName").addEventListener("keydown", (event) => event.key === "Enter" && joinRoom());
    Object.assign(window, { single, showMulti, createRoom, joinRoom, rps, guess, restart, home });
  </script>
</body>
</html>
